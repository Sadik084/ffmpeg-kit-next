name: Build AARs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PLATFORM_VERSION: '34'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build-aar:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm-v7a
            abi: armeabi-v7a
          - arch: arm64-v8a
            abi: arm64-v8a
          - arch: x86-64
            abi: x86_64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config gettext autopoint \
            cmake bison meson ninja-build nasm yasm gperf ragel \
            texinfo autogen groff gtk-doc-tools libtasn1-6-dev \
            tcl doxygen gcc g++ make patch file findutils gawk \
            rsync python3 perl ruby curl wget git zip unzip \
            xz-utils tar gzip sed grep diffutils bash which

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDK_MANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes 2>/dev/null | "$SDK_MANAGER" --licenses >/dev/null || true

          "$SDK_MANAGER" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          {
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Configure playback-only FFmpeg
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/android/ffmpeg.sh")
          content = path.read_text()

          needle = '  ${CONFIGURE_POSTFIX} 1>>"${BASEDIR}"/build.log 2>&1'

          replacement = r'''  ${CONFIGURE_POSTFIX} \
            --disable-encoders \
            --disable-muxers \
            --disable-filters \
            --disable-indevs \
            --disable-outdevs \
            --disable-network \
            --disable-demuxer=hls \
            --disable-demuxer=image2 \
            --disable-demuxer=image2pipe \
            --disable-decoder=png \
            --disable-decoder=bmp \
            --disable-decoder=gif \
            --disable-decoder=webp \
            --disable-decoder=tiff \
            1>>"${BASEDIR}"/build.log 2>&1'''

          if content.count(needle) != 1:
              raise SystemExit(
                  "Could not find the expected FFmpeg configure location. "
                  "Review scripts/android/ffmpeg.sh."
              )

          path.write_text(content.replace(needle, replacement))
          print("Playback-only FFmpeg configuration applied.")
          PY

      # With --no-ffmpeg-kit-protocols the custom memory/stream protocol
      # handlers in ffmpegkit.c are compiled out of use but still defined,
      # so clang reports -Wunused-function and -Werror makes it fatal.
      # Keep -Werror for everything else; only demote this one warning.
      - name: Demote unused-function warning to non-fatal
        run: |
          set -euo pipefail

          mapfile -t FILES < <(
            grep -rIl --include='*.mk' --exclude-dir=.git --exclude-dir=prebuilt \
              -e '-Werror' . || true
          )

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No -Werror found in any .mk file; locating its source:"
            grep -rIn --exclude-dir=.git --exclude-dir=prebuilt -e '-Werror' . || true
            echo "Patch the file listed above (e.g. android.sh APP_CFLAGS)."
            exit 1
          fi

          for f in "${FILES[@]}"; do
            if ! grep -q -- '-Wno-error=unused-function' "$f"; then
              sed -i 's/-Werror\b/-Werror -Wno-error=unused-function/g' "$f"
            fi
            echo "Patched: $f"
            grep -n -- 'Werror' "$f"
          done

      - name: Build FFmpegKitNext
        run: |
          set -euo pipefail

          ./android.sh \
            --arch="${{ matrix.arch }}" \
            --api-level=26 \
            --no-ffmpeg-kit-protocols

      - name: Collect AAR
        run: |
          set -euo pipefail

          mapfile -t AARS < <(
            find prebuilt -type f -name '*.aar'
          )

          if [[ ${#AARS[@]} -ne 1 ]]; then
            echo "Expected exactly one AAR."
            echo "Found: ${#AARS[@]}"
            find prebuilt -type f -name '*.aar'
            exit 1
          fi

          mkdir -p "artifacts/${{ matrix.abi }}"

          cp "${AARS[0]}" \
            "artifacts/${{ matrix.abi }}/ffmpeg-kit-next-${{ matrix.abi }}.aar"

          echo "AAR successfully generated:"
          ls -lh "artifacts/${{ matrix.abi }}/"

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/*.aar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.abi }}
          path: build.log
          if-no-files-found: warn
          retention-days: 7
