
name: Build Android Architecture AARs

on:
  workflow_dispatch:
    inputs:
      extra-options:
        description: 'Extra options appended to android.sh (do not include --arch)'
        required: false
        default: ''

env:
  ANDROID_PLATFORM_VERSION: '34'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build-aar:
    name: Build ${{ matrix.name }} AAR
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm-v7a
            name: armeabi-v7a
          - arch: arm64-v8a
            name: arm64-v8a
          - arch: x86-64
            name: x86_64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config gettext autopoint \
            cmake bison meson ninja-build nasm yasm gperf ragel texinfo autogen \
            groff gtk-doc-tools libtasn1-6-dev tcl doxygen \
            gcc g++ make patch file findutils gawk rsync \
            python3 perl ruby curl wget git zip unzip xz-utils tar gzip sed grep diffutils \
            bash which

      - name: Set up Android SDK and NDK
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDK_MANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          yes 2>/dev/null | "${SDK_MANAGER}" --licenses >/dev/null || true

          "${SDK_MANAGER}" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          {
            echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
            echo "ANDROID_HOME=${SDK_ROOT}"
            echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Build architecture-specific AAR
        env:
          EXTRA_OPTIONS: ${{ inputs.extra-options }}
        run: |
          set -euo pipefail

          echo "Building architecture: ${{ matrix.arch }}"

          ./android.sh \
            --enable-lib-all \
            --enable-gpl \
            --disable-lib-gnutls \
            ${EXTRA_OPTIONS} \
            --arch="${{ matrix.arch }}"

      - name: Collect generated AAR
        run: |
          set -euo pipefail

          mapfile -t AARS < <(
            find prebuilt -type f \
              -name 'ffmpeg-kit-next-*.aar'
          )

          if [[ ${#AARS[@]} -ne 1 ]]; then
            echo "Expected exactly one AAR, found ${#AARS[@]}"
            find prebuilt -type f -name '*.aar'
            exit 1
          fi

          mkdir -p "artifacts/${{ matrix.name }}"

          cp "${AARS[0]}" \
            "artifacts/${{ matrix.name }}/ffmpeg-kit-next-${{ matrix.name }}.aar"

          echo "Generated AAR:"
          ls -lh "artifacts/${{ matrix.name }}/"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-next-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/*.aar
          if-no-files-found: error
          compression-level: 0

      - name: Print build logs on failure
        if: failure()
        run: |
          if [[ -f build.log ]]; then
            cat build.log
          fi
